name: Playwright Tests

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality-gates:
    name: Quality gates (typecheck, lint, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # playwright.config.ts imports config/environment.ts unconditionally,
      # which requires BASE_URL to be set even just to enumerate/run the
      # `unit` project (pure functions, no browser, no real dependency on
      # the app under test). This placeholder satisfies that requirement
      # without this job needing real app credentials.
      BASE_URL: http://localhost

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

  e2e-api-tests:
    name: E2E + API tests
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TEST_ENV: local
      BASE_URL: ${{ vars.BASE_URL || 'http://lojaebac.ebaconline.art.br' }}
      TEST_USER: ${{ secrets.TEST_USER }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E and API tests
        run: npx playwright test --project=chromium-e2e --project=chromium-api

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failure evidence (traces, videos, screenshots)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 14
